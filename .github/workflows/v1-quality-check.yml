name: V1 quality checks
on:
  push:
    branches:
      - feature/professional-boq-v1
    paths:
      - "v1/**"
      - ".github/workflows/v1-quality-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "v1/**"
      - ".github/workflows/v1-quality-check.yml"
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check v1/app.js
      - name: Check HTML and JavaScript integration
        run: node v1/tests/static-check.js
      - name: Install browser test dependency
        run: npm install --no-save playwright https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz pdf-lib
      - name: Install Chromium
        run: npx playwright install chromium --only-shell
      - name: Install Edge and WebKit engines
        run: npx playwright install msedge webkit --with-deps
      - name: Install PDF rasterizer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Run browser smoke tests
        run: node v1/tests/browser-smoke.js
      - name: Run cross-browser acceptance tests
        run: node v1/tests/browser-compat.js
      - name: Render PDF pages for visual review
        if: always()
        run: |
          if [ -f artifacts/boq-report-en.pdf ]; then pdftoppm -png -r 110 artifacts/boq-report-en.pdf artifacts/en-page; fi
          if [ -f artifacts/boq-report-ar.pdf ]; then pdftoppm -png -r 110 artifacts/boq-report-ar.pdf artifacts/ar-page; fi
      - name: Upload bilingual PDF and page previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boq-pdf-visual-review
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
